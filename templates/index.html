<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ chatbot_title }}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #ff9966, #ff5e62);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .chat-container {
    width: 100%;
    max-width: 600px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 85vh;
  }

  .chat-header {
    background: #ff5e62;
    color: white;
    padding: 20px;
    text-align: center;
  }

  .chat-header h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }

  .chat-header p {
    font-size: 13px;
    opacity: 0.9;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #fff9f5;
  }

  .message {
    margin-bottom: 14px;
    display: flex;
  }

  .message.user {
    justify-content: flex-end;
  }

  .message .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
  }

  .message.user .bubble {
    background: #ff5e62;
    color: white;
    border-bottom-right-radius: 4px;
  }

  .message.bot .bubble {
    background: #f0f0f0;
    color: #333;
    border-bottom-left-radius: 4px;
  }

  .chat-input-area {
    display: flex;
    padding: 16px;
    border-top: 1px solid #eee;
    background: white;
    gap: 8px;
  }

  #userInput {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 24px;
    font-size: 14px;
    outline: none;
  }

  #userInput:focus {
    border-color: #ff5e62;
  }

  #sendBtn {
    background: #ff5e62;
    color: white;
    border: none;
    border-radius: 24px;
    padding: 12px 22px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }

  #sendBtn:hover {
    background: #ff3d42;
  }

  #sendBtn:disabled {
    background: #ccc;
    cursor: not-allowed;
  }

  .typing {
    font-size: 13px;
    color: #999;
    font-style: italic;
    padding: 0 20px 10px;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h1>🍳 {{ chatbot_title }}</h1>
    <p>Enna irukku veetla? Sollunga, recipe suggest pannuren!</p>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="message bot">
      <div class="bubble">Vanakkam! 👋 Ungaloda veetla enna ingredients irukku nu sollunga, naan recipe suggest pannuren!</div>
    </div>
  </div>

  <div class="typing" id="typingIndicator" style="display:none;">Enna Samaikalam is typing...</div>

  <div class="chat-input-area">
    <input type="text" id="userInput" placeholder="Eg: rice, egg, onion irukku..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
const chatMessages = document.getElementById('chatMessages');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const typingIndicator = document.getElementById('typingIndicator');

function addMessage(text, sender) {
  const messageDiv = document.createElement('div');
  messageDiv.className = `message ${sender}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  messageDiv.appendChild(bubble);
  chatMessages.appendChild(messageDiv);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function sendMessage() {
  const message = userInput.value.trim();
  if (!message) return;

  addMessage(message, 'user');
  userInput.value = '';
  sendBtn.disabled = true;
  typingIndicator.style.display = 'block';

  try {
    const response = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: message })
    });

    const data = await response.json();

    if (data.error) {
      addMessage("Sorry da, error vandhuruchu: " + data.error, 'bot');
    } else {
      addMessage(data.reply, 'bot');
    }
  } catch (err) {
    addMessage("Connection error! Server run aaguthaa nu check pannunga.", 'bot');
  } finally {
    sendBtn.disabled = false;
    typingIndicator.style.display = 'none';
    userInput.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
